<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lobby — KOTA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background: #0b0d12;
      color: #ffffff;

      font-family: Arial, Helvetica, sans-serif;
    }

    .navbar {
      height: 72px;

      border-bottom: 1px solid #292e38;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 32px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logout-button {
      border: 1px solid #303641;
      background: transparent;
      color: #aeb4c0;

      padding: 9px 16px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 13px;
    }

    .logout-button:hover {
      color: #ffffff;
      border-color: #ffffff;
    }

    .container {
      width: min(1000px, 92%);

      margin: 0 auto;

      padding: 60px 0;
    }

    .welcome {
      margin-bottom: 40px;
    }

    .welcome h1 {
      font-size: clamp(34px, 5vw, 52px);

      letter-spacing: -2px;

      margin-bottom: 10px;
    }

    .welcome p {
      color: #858c99;

      font-size: 16px;
    }

    .actions {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 20px;

      margin-bottom: 40px;
    }

    .action-card {
      min-height: 190px;

      padding: 28px;

      border: 1px solid #292e38;
      border-radius: 18px;

      background: #11141b;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .action-card:hover {
      transform: translateY(-3px);

      border-color: #ffffff;
    }

    .action-icon {
      width: 48px;
      height: 48px;

      border-radius: 12px;

      border: 1px solid #303641;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;

      margin-bottom: 24px;
    }

    .action-card h2 {
      font-size: 21px;

      margin-bottom: 8px;
    }

    .action-card p {
      color: #737a87;

      font-size: 14px;

      line-height: 1.5;
    }

    .profile-card {
      border: 1px solid #292e38;
      border-radius: 18px;

      background: #11141b;

      padding: 28px;
    }

    .profile-title {
      color: #737a87;

      font-size: 13px;
      text-transform: uppercase;

      letter-spacing: 1px;

      margin-bottom: 18px;
    }

    .profile-row {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 14px 0;

      border-bottom: 1px solid #20242d;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .profile-label {
      color: #737a87;

      font-size: 14px;
    }

    .profile-value {
      color: #ffffff;

      font-size: 14px;
      font-weight: 600;
    }

    .loading {
      color: #737a87;
    }

    @media (max-width: 700px) {

      .navbar {
        padding: 0 20px;
      }

      .container {
        padding: 40px 0;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .action-card {
        min-height: 160px;
      }

    }
  </style>
</head>

<body>

  <header class="navbar">

    <div class="brand">
      KOTA
    </div>

    <button
      id="logoutButton"
      class="logout-button"
    >
      Logout
    </button>

  </header>


  <main class="container">

    <section class="welcome">

      <h1>
        Welcome back,
        <span id="username">
          ...
        </span>
      </h1>

      <p>
        Siap untuk bermain?
      </p>

    </section>


    <section class="actions">

      <div
        class="action-card"
        id="createRoomCard"
      >

        <div class="action-icon">
          +
        </div>

        <h2>
          Create Room
        </h2>

        <p>
          Buat room baru dan undang pemain lain
          untuk bermain bersama.
        </p>

      </div>


      <div
        class="action-card"
        id="joinRoomCard"
      >

        <div class="action-icon">
          →
        </div>

        <h2>
          Join Room
        </h2>

        <p>
          Masukkan kode room untuk bergabung
          dengan permainan yang sudah dibuat.
        </p>

      </div>

    </section>


    <section class="profile-card">

      <div class="profile-title">
        Your Profile
      </div>


      <div class="profile-row">

        <span class="profile-label">
          Username
        </span>

        <span
          class="profile-value"
          id="profileUsername"
        >
          <span class="loading">
            Loading...
          </span>
        </span>

      </div>


      <div class="profile-row">

        <span class="profile-label">
          Email
        </span>

        <span
          class="profile-value"
          id="profileEmail"
        >
          <span class="loading">
            Loading...
          </span>
        </span>

      </div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>

  <script src="js/auth.js"></script>

  <script src="js/lobby.js"></script>

</body>
</html>
