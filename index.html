<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KOTA — Multiplayer Board Game</title>

  <meta
    name="description"
    content="KOTA adalah multiplayer strategy board game berbasis web."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0d12;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      width: min(900px, 92%);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 28px;
      border: 3px solid #ffffff;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    h1 {
      font-size: clamp(56px, 12vw, 110px);
      line-height: 0.9;
      letter-spacing: -6px;
      margin-bottom: 24px;
    }

    .tagline {
      max-width: 620px;
      margin: 0 auto;
      color: #aeb4c0;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 34px;
      padding: 10px 16px;
      border: 1px solid #292e38;
      border-radius: 999px;
      color: #c7ccd5;
      font-size: 14px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
    }

    .footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #555b66;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      KO
    </div>

    <h1>KOTA</h1>

    <p class="tagline">
      Multiplayer strategy board game.
      Bangun kota, kuasai properti, baca lawan,
      dan jadilah pemain dengan strategi terbaik.
    </p>

    <div class="status">
      <span class="dot"></span>
      Development in progress
    </div>

  </main>

  <div class="footer">
    KOTA Game © 2026
  </div>

</body>
</html>
